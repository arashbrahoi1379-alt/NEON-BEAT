<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09051b"><title>NEON BEAT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080514;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
button{font-family:inherit;cursor:pointer}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:14px;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#100c28c9;border:1px solid #ffffff30;border-radius:16px;padding:8px 12px;backdrop-filter:blur(8px);font-size:13px}
#score{font-size:22px;font-weight:bold;color:#fff;text-shadow:0 0 14px #ff36be}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#36104cdd,#090515f5 70%);padding:16px;overflow:auto}
.panel{width:min(440px,100%);max-height:94dvh;overflow:auto;text-align:center;border:1px solid #ff5bd766;border-radius:26px;padding:22px 18px;background:linear-gradient(145deg,#21103de8,#0a0a20f5);box-shadow:0 0 50px #e92b9b33}
h1{font-size:36px;letter-spacing:2px;margin:0;color:#ff70d4;text-shadow:0 0 22px #ff28ae}
h2{font-size:22px;margin:5px 0 14px;color:#ffe1fa}
p{line-height:1.85;color:#d8cce8;font-size:13px}
.btn{border:0;border-radius:15px;padding:13px 15px;font-size:15px;font-weight:bold;background:linear-gradient(90deg,#ff3aa9,#8a5cff);color:white;width:100%;margin-top:9px;box-shadow:0 8px 25px #d42ca944}
.btn.alt{background:#21183b;border:1px solid #ffffff2b;box-shadow:none}.btn:disabled{opacity:.35}
.row{display:flex;gap:8px}.row>*{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tilecard{border:1px solid #ffffff2b;border-radius:15px;padding:12px;background:#ffffff0b;text-align:center}
.tilecard strong{display:block;margin:4px}.muted{color:#bcaed0;font-size:12px}.selected{border-color:#ff63d0;box-shadow:0 0 18px #f34ab344}
#hint{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#ffffffb0;font-size:12px;pointer-events:none;text-shadow:0 2px 8px #000;z-index:3}
.hidden{display:none!important}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#42105d 0%,#160727 42%,#05030f 100%);transition:opacity .7s,visibility .7s}
#loading.out{opacity:0;visibility:hidden;pointer-events:none}
.load-stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff9 50%,transparent 60%),radial-gradient(1px 1px at 78% 16%,#fff 50%,transparent 60%),radial-gradient(2px 2px at 88% 66%,#ff8de8 50%,transparent 60%);opacity:.65}
.load-grid{position:absolute;width:180%;height:58%;bottom:-23%;left:-40%;transform:perspective(260px) rotateX(62deg);background:linear-gradient(#ff38c51c 1px,transparent 1px),linear-gradient(90deg,#ff38c51c 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to top,black,transparent);animation:gridMove 3s linear infinite}
@keyframes gridMove{to{background-position:0 42px,42px 0}}
.load-content{position:relative;z-index:2;width:min(430px,90vw);text-align:center}.load-emblem{height:210px;display:grid;place-items:center;perspective:700px;position:relative}
.load-orb{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 5%,#ffd9fa 12%,#ff51c8 38%,#8c25ff 68%,#210a55 100%);box-shadow:0 0 25px #ff4acb,0 0 75px #c52dff,0 0 130px #8e28ff;animation:orbFloat 2.3s ease-in-out infinite}
.load-orb:before,.load-orb:after{content:"";position:absolute;inset:calc(50% - 78px);border:3px solid #ff8ee9;border-radius:50%;transform:rotateX(70deg) rotateY(-18deg);box-shadow:0 0 18px #ff42cb}
.load-orb:after{inset:calc(50% - 94px);border-color:#7ceaff;transform:rotateX(70deg) rotateY(65deg);animation:orbitSpin 4s linear infinite}
.load-ring{position:absolute;width:195px;height:195px;border:1px solid #ff69d877;border-radius:50%;transform:rotateX(68deg);animation:ringSpin 8s linear infinite}
@keyframes orbFloat{50%{transform:translateY(-13px) scale(1.05)}}@keyframes orbitSpin{to{transform:rotateX(70deg) rotateY(65deg) rotateZ(360deg)}}@keyframes ringSpin{to{transform:rotateX(68deg) rotateZ(360deg)}}
.load-title{font-size:34px;font-weight:900;letter-spacing:3px;text-shadow:0 0 12px #ff56d2,0 0 35px #b832ff}.load-sub{color:#e9b9f5;font-size:12px;letter-spacing:2px;margin:8px 0 26px}
.load-track{height:8px;border-radius:99px;background:#ffffff20;overflow:hidden}.load-track div{height:100%;width:0;background:linear-gradient(90deg,#50dfff,#ff4acb,#a56bff);box-shadow:0 0 16px #ff45d2;transition:width .12s}
.load-percent{display:flex;justify-content:space-between;color:#e9d9f4;font-size:11px;margin-top:9px}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="loading"><div class="load-stars"></div><div class="load-grid"></div><div class="load-content"><div class="load-emblem"><div class="load-ring"></div><div class="load-orb"></div></div><div class="load-title">NEON BEAT</div><div class="load-sub">FEEL THE RHYTHM • OWN THE BEAT</div><div class="load-track"><div id="loadFill"></div></div><div class="load-percent"><span>در حال آماده‌سازی دنیای نئون...</span><b id="loadPct">۰٪</b></div></div></div>
<div id="hud" class="hidden"><div class="top"><div class="pill">امتیاز: <b id="score">۰</b></div><div class="pill">رکورد: <b id="best">۰</b></div><button id="pause" class="pill">Ⅱ توقف</button></div><div class="top"><div class="pill" id="combo">ضریب ×۱</div><div class="pill" id="stage">مرحله ۱</div></div></div>
<div id="hint" class="hidden">انگشتت را به چپ و راست بکش تا توپ روی کاشی‌ها فرود بیاید</div>
<div id="menu"><div class="panel" id="panel"></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
let W,H,D;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const themes={pink:{bg:'#f77bb3',glow:'#ff3cb8',tile:'#ff50c5',name:'غروب صورتی',price:0},blue:{bg:'#32c9fa',glow:'#00d8ff',tile:'#12cfff',name:'زمستان یخی',price:0},orange:{bg:'#ffad80',glow:'#ff592e',tile:'#ff704c',name:'غروب نارنجی',price:0},purple:{bg:'#9b70ff',glow:'#a45aff',tile:'#c06aff',name:'کهکشان بنفش',price:120}};
const songs=[{name:'Neon Pulse',desc:'ضرب‌آهنگ الکترونیک',bpm:112},{name:'Midnight Drive',desc:'سینث‌ویو شبانه',bpm:124},{name:'Pink Horizon',desc:'ملودی آرام و درخشان',bpm:98}];
let unlocked=+(localStorage.nbLevels||1),best=+(localStorage.nbBest||0),coins=+(localStorage.nbCoins||0),owned=JSON.parse(localStorage.nbThemes||'["pink","blue","orange"]'),theme=localStorage.nbTheme||'pink',song=+(localStorage.nbSong||0),level=1,score=0,combo=1,ballX=.5,targetX=.5,tiles=[],particles=[],running=false,paused=false,last=0,elapsed=0,audio=null,beatMs=0,missed=false,drag=false,settings={sound:true,volume:.45};
$('best').textContent=best.toLocaleString('fa-IR');
function save(){localStorage.nbLevels=unlocked;localStorage.nbBest=best;localStorage.nbCoins=coins;localStorage.nbThemes=JSON.stringify(owned);localStorage.nbTheme=theme;localStorage.nbSong=song}
function menuShell(title,body){$('menu').classList.remove('hidden');$('panel').innerHTML=`<h1>NEON BEAT</h1><h2>${title}</h2>${body}`}
function mainMenu(){ $('hud').classList.add('hidden');$('hint').classList.add('hidden');menuShell('ضرب‌آهنگ نئون',`<p>روی کاشی‌های نورانی فرود بیا، با ریتم حرکت کن و رکوردت را بشکن.</p><div class="tilecard">🪙 سکه‌ها: <b>${coins.toLocaleString('fa-IR')}</b>　🏆 رکورد: <b>${best.toLocaleString('fa-IR')}</b></div><button class="btn" id="play">▶ شروع بازی</button><div class="grid"><button class="btn alt" id="levels">🗺 مراحل</button><button class="btn alt" id="songs">♫ انتخاب آهنگ</button><button class="btn alt" id="shop">✦ فروشگاه توپ و محیط</button><button class="btn alt" id="settings">⚙ تنظیمات</button></div><p class="muted">پیشرفت و رکورد روی همین دستگاه ذخیره می‌شود.</p>`);
$('play').onclick=()=>levelMenu();$('levels').onclick=levelMenu;$('songs').onclick=songMenu;$('shop').onclick=shopMenu;$('settings').onclick=settingsMenu}
function levelMenu(){let cards='';for(let i=1;i<=12;i++){let open=i<=unlocked;cards+=`<button class="tilecard ${i===level?'selected':''}" data-level="${i}" ${open?'':'disabled'}><strong>${open?'مرحله':'🔒'} ${i}</strong><span class="muted">${i<=3?'آسان':i<=7?'متوسط':'حرفه‌ای'}</span></button>`}
menuShell('انتخاب مرحله',`<p>مرحله‌های بازشده: ${unlocked} از ۱۲</p><div class="grid">${cards}</div><button class="btn" id="go">شروع مرحله ${level}</button><button class="btn alt" id="back">بازگشت</button>`);
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;levelMenu()});$('go').onclick=startGame;$('back').onclick=mainMenu}
function songMenu(){menuShell('انتخاب موسیقی',`<p>دموی ریتمیک با صدای ساخته‌شده در خود بازی؛ آهنگ تجاری داخل بازی قرار نگرفته است.</p>${songs.map((s,i)=>`<button class="tilecard ${i===song?'selected':''}" style="width:100%;margin:5px 0" data-song="${i}"><strong>♫ ${s.name}</strong><span class="muted">${s.desc} • ${s.bpm} BPM</span></button>`).join('')}<button class="btn alt" id="back">بازگشت</button>`);
document.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>{song=+b.dataset.song;save();songMenu()});$('back').onclick=mainMenu}
function shopMenu(){menuShell('فروشگاه نئون',`<p>سکه‌ها: 🪙 ${coins}</p><div class="grid">${Object.entries(themes).map(([id,t])=>`<div class="tilecard ${theme===id?'selected':''}"><div style="height:36px;border-radius:10px;background:${t.tile};box-shadow:0 0 22px ${t.glow}"></div><strong>${t.name}</strong><span class="muted">${owned.includes(id)?'آزاد شده':t.price+' سکه'}</span><button class="btn ${owned.includes(id)?'alt':''}" data-theme="${id}">${owned.includes(id)?(theme===id?'انتخاب شده':'انتخاب'):'خرید'}</button></div>`).join('')}</div><button class="btn alt" id="back">بازگشت</button>`);
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{let id=b.dataset.theme;if(!owned.includes(id)){if(coins<themes[id].price){b.textContent='سکه کافی نیست';return}coins-=themes[id].price;owned.push(id)}theme=id;save();shopMenu()});$('back').onclick=mainMenu}

}

function settingsMenu(){menuShell('تنظیمات',`<div class="tilecard"><strong>صدا</strong><button class="btn alt" id="sound">${settings.sound?'روشن':'خاموش'}</button><p class="muted">صدای افکت‌ها و ضرب‌آهنگ</p><input id="volume" type="range" min="0" max="100" value="${settings.volume*100}" style="width:100%"></div><div class="tilecard" style="margin-top:9px"><strong>کنترل</strong><p class="muted">لمس و کشیدن انگشت به چپ و راست</p></div><button class="btn alt" id="back">بازگشت</button>`);$('sound').onclick=()=>{settings.sound=!settings.sound;settingsMenu()};$('volume').oninput=e=>settings.volume=e.target.value/100;$('back').onclick=mainMenu}
function audioStart(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function beep(freq=220,dur=.09){if(!audio||!settings.sound)return;let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.08*settings.volume,audio.currentTime+.012);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02)}
function startGame(){audioStart();score=0;combo=1;elapsed=0;missed=false;ballX=targetX=.5;particles=[];tiles=[];for(let i=0;i<12;i++)tiles.push({x:i===0?.5:(i%2?.68:.32),z:i/12+.04,hit:false});running=true;paused=false;$('menu').classList.add('hidden');$('hud').classList.remove('hidden');$('hint').classList.remove('hidden');$('pause').textContent='Ⅱ توقف';$('score').textContent='۰';$('combo').textContent='ضریب ×۱';$('stage').textContent='مرحله '+level;last=performance.now();requestAnimationFrame(loop)}
function pauseGame(){if(!running)return;paused=!paused;if(paused){$('pause').textContent='▶ ادامه';menuShell('بازی متوقف شد',`<p>هر وقت آماده بودی ادامه بده.</p><button class="btn" id="resume">▶ ادامه بازی</button><button class="btn alt" id="quit">خروج به منو</button>`);$('resume').onclick=()=>{paused=false;$('menu').classList.add('hidden');$('pause').textContent='Ⅱ توقف';last=performance.now()};$('quit').onclick=()=>{running=false;mainMenu()}}else{$('menu').classList.add('hidden');$('pause').textContent='Ⅱ توقف';last=performance.now()}}
$('pause').onclick=pauseGame;
function endGame(won=false){running=false;$('hud').classList.add('hidden');$('hint').classList.add('hidden');if(score>best)best=score;let reward=Math.max(5,Math.floor(score/30)+(won?20:0));coins+=reward;if(won&&level===unlocked&&unlocked<12)unlocked++;save();menuShell(won?'مرحله را بردی!':'پایان بازی',`<p>${won?'آفرین! مسیر را کامل کردی.':'این بار نشد؛ دوباره امتحان کن!'}</p><div class="tilecard">امتیاز: <b>${score}</b><br>رکورد: <b>${best}</b><br>پاداش: 🪙 <b>${reward}</b></div><button class="btn" id="again">تلاش دوباره</button><button class="btn alt" id="home">منوی اصلی</button>`);$('again').onclick=startGame;$('home').onclick=mainMenu}
function project(z){return{y:H*.25+(1-z)*(H*.62),scale:.2+(1-z)*1.2}}
function background(p){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,p.bg);g.addColorStop(.45,'#32123e');g.addColorStop(1,'#09051c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let l=0;l<3;l++){ctx.beginPath();let base=H*(.32+l*.05);ctx.moveTo(0,base);for(let x=0;x<=W+25;x+=25)ctx.lineTo(x,base-Math.abs(Math.sin(x*.009+l*2))*H*(.07+l*.015));ctx.lineTo(W,H*.57);ctx.lineTo(0,H*.57);ctx.closePath();ctx.fillStyle=['#491747','#2b123b','#170d2d'][l];ctx.fill()} }
function drawTile(t,p){let q=project(t.z),x=t.x*W,w=W*.12*q.scale,h=H*.034*q.scale;ctx.save();ctx.translate(x,q.y);ctx.shadowBlur=22*q.scale;ctx.shadowColor=p.glow;ctx.fillStyle=p.tile;ctx.strokeStyle='#fff';ctx.lineWidth=2.3*q.scale;ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,5*q.scale);ctx.fill();ctx.stroke();ctx.restore()}
function drawBall(p){let x=ballX*W,y=H*.79,r=Math.min(W,H)*.046;ctx.save();ctx.shadowColor=p.glow;ctx.shadowBlur=38;let g=ctx.createRadialGradient(x-r*.3,y-r*.4,2,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.5,'#fff');g.addColorStop(1,p.tile);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y+r,r*1.8,r*.35,0,0,7);ctx.stroke()}
function loop(now){if(!running)return;requestAnimationFrame(loop);if(paused)return;let dt=Math.min(40,now-last);last=now;elapsed+=dt;beatMs+=dt;let p=themes[theme];let pace=.00019+level*.000012+Math.min(score*.0000004,.00012);ballX+=(targetX-ballX)*Math.min(1,dt*.012);
if(beatMs>60000/songs[song].bpm){beep(180+combo*24,.08);beatMs=0}
let near=tiles.filter(t=>!t.hit&&t.z<.085&&t.z>=0).sort((a,b)=>a.z-b.z)[0];
if(near&&near.z<.06){if(Math.abs(ballX-near.x)<.22){near.hit=true;score+=10*combo;combo=Math.min(8,combo+1);$('score').textContent=score.toLocaleString('fa-IR');$('combo').textContent='ضریب ×'+combo;beep(360+combo*40,.1);for(let i=0;i<10;i++)particles.push({x:ballX*W,y:H*.79,vx:(Math.random()-.5)*5,vy:-Math.random()*5,life:1})}else if(near.z<.015){endGame(false);return}}
for(let t of tiles){t.z-=dt*pace;if(t.z<-.03){if(!t.hit){/* passed safely only if a different landing was made */}t.z+=1.02;t.x=.22+Math.random()*.56;t.hit=false}}
if(elapsed>45000+level*5000){endGame(true);return}
background(p);let lane=ctx.createLinearGradient(0,H*.4,0,H);lane.addColorStop(0,'#100b2800');lane.addColorStop(1,p.glow+'22');ctx.fillStyle=lane;ctx.beginPath();ctx.moveTo(W*.47,H*.38);ctx.lineTo(W*.53,H*.38);ctx.lineTo(W*.94,H);ctx.lineTo(W*.06,H);ctx.fill();tiles.slice().sort((a,b)=>a.z-b.z).forEach(t=>drawTile(t,p));drawBall(p);
particles=particles.filter(a=>a.life>0);for(let a of particles){a.x+=a.vx;a.y+=a.vy;a.life-=.04;ctx.globalAlpha=a.life;ctx.fillStyle=p.glow;ctx.beginPath();ctx.arc(a.x,a.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;
}
function steer(e){if(!running||paused)return;targetX=Math.max(.12,Math.min(.88,e.clientX/W))}
canvas.addEventListener('pointerdown',e=>{drag=true;steer(e)});canvas.addEventListener('pointermove',e=>{if(drag)steer(e)});addEventListener('pointerup',()=>drag=false);
mainMenu();
let pct=0;const boot=setInterval(()=>{pct=Math.min(100,pct+7+Math.random()*9);$('loadFill').style.width=pct+'%';$('loadPct').textContent=Math.floor(pct).toLocaleString('fa-IR')+'٪';if(pct>=100){clearInterval(boot);setTimeout(()=>$('loading').classList.add('out'),400)}},110);
})();
</script></body></html>
